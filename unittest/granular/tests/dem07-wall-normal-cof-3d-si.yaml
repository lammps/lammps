---
lammps_version: REGENERATE
tags: granular, generated
date_generated: REGENERATE
epsilon: 1e-10
skip_tests:
prerequisites: ! |
  atom sphere
  pair granular
# Source: normal_contact_cof.in (user script).
# Single sphere normal-impacting a rigid wall, fully elastic (e = 1),
# frictionless tangential response. Re-expressed with the wall normal along
# +z (test_analytic_models.cpp's hertz_normal_impact model assumes a
# z-plane wall) instead of the original script's xplane; all material
# and kinematic values are otherwise unchanged from the source script.
pre_commands: ! |
  units si
  dimension 3
  boundary f f f
  atom_style sphere
  region box block -0.05 0.05 -0.05 0.05 -0.05 0.1 units box
  create_box 1 box
  create_atoms 1 single 0.0 0.0 ${z0} units box
  set group all diameter ${diam} density ${dens}
  velocity all set 0.0 0.0 -${vin}
  comm_modify vel yes
  neighbor 0.001 bin
  neigh_modify delay 0
  timestep ${dt}
post_commands: ! |
  fix integr all nve/sphere
  fix zwall all wall/gran granular hertz/material ${emod} ${en} ${poisson} tangential linear_nohistory 0.0 0.0 damping coeff_restitution zplane 0.0 NULL
input_file:
natoms: 1
variables: ! |
  diam 0.005
  dens 7000.0
  emod 1.0e11
  poisson 0.25
  en 1.0
  vin 3.9
  vrela 3.9
  mred_factor 1.0
  floor 0.0
  radius 0.0025
  dt 1.0e-8
  z0 0.002550
pair_style: granular
pair_coeff: ! |
  * * hertz/material ${emod} ${en} ${poisson} tangential linear_nohistory 0.0 0.0 damping coeff_restitution
# NOTE: run_segments and the run_pos/run_vel/run_torque/run_omega reference
# blocks below are NOT yet generated -- they must be produced by actually
# running the compiled test program against a built LAMMPS+GRANULAR, e.g.:
#   test_dem_11 tests/dem11-wall-normal-cof-3d-si.yaml -g new.yaml
# then inspecting/renaming new.yaml, or updating in place with -u.
# The starting gap (z0) is small so contact happens quickly; the first
# analytic_segment should land at (or very near) peak compression --
# check with -s to see per-quantity error stats and retune if needed.
run_segments: ! |-
  1300 900
analytic_enable: yes
analytic_model: hertz_normal_impact
analytic_tol: 0.01
analytic_segment: 0
run_pos: ! |2
  # TODO: regenerate -- see NOTE above
run_vel: ! |2
  # TODO: regenerate -- see NOTE above
run_torque: ! |2
  # TODO: regenerate -- see NOTE above
run_omega: ! |2
  # TODO: regenerate -- see NOTE above
...
