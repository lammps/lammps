---
lammps_version: REGENERATE
tags: granular, generated
date_generated: REGENERATE
epsilon: 1e-10
skip_tests:
prerequisites: ! |
  atom sphere
  pair granular
# Source: angular_sphere_impact.in (user script). Two identical spheres
# collide head-on along x (equal & opposite velocity and spin). Collision
# axis is already x, matching collision_restitution's hardcoded momentum/
# restitution check along the atom-array x-component, so no remapping was
# needed. The model checks momentum conservation + coefficient of
# restitution along the collision axis; it does not assert on the spin
# components, which the source script sets equal & opposite for coverage
# of the tangential/rolling sub-models but are not asserted here.
pre_commands: ! |
  units si
  dimension 3
  boundary f f f
  atom_style sphere
  region box block -0.2 0.2 -0.1 0.1 -0.1 0.1 units box
  create_box 1 box
  create_atoms 1 single -${sep} 0.0 0.0 units box
  create_atoms 1 single  ${sep} 0.0 0.0 units box
  set group all diameter ${diam} density ${dens}
  group left id 1
  group right id 2
  velocity left set ${vin} 0.0 0.0
  velocity right set -${vin} 0.0 0.0
  set group left omega 0.0 0.0 ${omega0}
  set group right omega 0.0 0.0 -${omega0}
  comm_modify vel yes
  neighbor 0.001 bin
  neigh_modify delay 0
  timestep ${dt}
post_commands: ! |
  fix integr all nve/sphere
input_file:
natoms: 2
variables: ! |
  diam 0.005
  dens 2700.0
  emod 7.0e10
  poisson 0.33
  en 0.5
  xmu 0.4
  vin 2.0
  omega0 22.0
  radius 0.0025
  dt 1.0e-8
  sep 0.002550
pair_style: granular
pair_coeff: ! |
  * * hertz/material ${emod} ${en} ${poisson} damping coeff_restitution tangential mindlin NULL 0.5 ${xmu}
# NOTE: see dem11-wall-normal-cof-3d-si.yaml for the regeneration workflow.
run_segments: ! |-
  1300 900
analytic_enable: yes
analytic_model: collision_restitution
analytic_tol: 0.02
analytic_segment: 1
run_pos: ! |2
  # TODO: regenerate -- see NOTE above
run_vel: ! |2
  # TODO: regenerate -- see NOTE above
run_torque: ! |2
  # TODO: regenerate -- see NOTE above
run_omega: ! |2
  # TODO: regenerate -- see NOTE above
...
