---
  lmp_binary: ""
  nprocs: "1"
  args: "-cite none"
  kokkos: false
  mpiexec: ""
  mpiexec_numproc_flag: ""
  tolerance:
    PotEng:
      abs: 1e-4
      rel: 1e-7
    TotEng:
      abs: 1e-4
      rel: 1e-7
    Press:
      abs: 1e-4
      rel: 1e-7
    Temp:
      abs: 1e-4
      rel: 1e-7
    E_vdwl:
      abs: 1e-3
      rel: 1e-7
  overrides:
    in.verify_xrd_fft:
      # the diffraction intensities themselves, so that this example checks the
      # transform rather than only that it ran.  the direct sum reproduces to
      # round-off; the FFT of it varies with the transform library, well inside
      # these tolerances, while any real regression is far outside them
      "c_XRD[739][1]":
        abs: 1e-6
        rel: 1e-9
      "c_XRD[739][2]":
        abs: 1e-4
        rel: 1e-7
      "c_XRDF[739][2]":
        abs: 1e-4
        rel: 1e-7
      "c_XRD[1][2]":
        abs: 1e-4
        rel: 1e-7
      "c_XRDF[1][2]":
        abs: 1e-4
        rel: 1e-7
      "c_XRD[1230][2]":
        abs: 1e-4
        rel: 1e-7
      "c_XRDF[1230][2]":
        abs: 1e-4
        rel: 1e-7
      "c_XRD[2460][2]":
        abs: 1e-4
        rel: 1e-7
      "c_XRDF[2460][2]":
        abs: 1e-4
        rel: 1e-7
    in.rigid.tnr:
      Temp:
        abs: 1e-3
        rel: 1e-5
      Press:
        abs: 1e-2
        rel: 1e-4
  skip:
    [
      in.*pod.Inp,
      in.disp,
      in.disp2,
      in.dos,
      in.dsring2,
      in.*_imd*,
      in.bucky-plus-cnt*,
    ]

  timeout: 30
  # input scripts in these folders must be run by the same worker in the listed
  # order, since they read files written by another input script in the folder
  # or would overwrite each other's output files
  keep_together:
    [
      PACKAGES/bocs/4_sites_LD_SG,
      PACKAGES/rhok,
      SPIN/read_restart,
    ]

  # input scripts without a reference log file cannot be checked against anything, so
  # they are only tested for not crashing, with their run commands shortened to this
  # many steps (0 or empty: run them unchanged)
  smoke_steps: 100

  nugget: 1.0
  epsilon: 1e-16


