---
  lmp_binary: ""
  nprocs: "4"
  args: "-cite none"
  kokkos: false
  mpiexec: "mpirun"
  mpiexec_numproc_flag: "--host localhost:4 -np"
  tolerance:
    PotEng:
      abs: 1e-4
      rel: 1e-7
    TotEng:
      abs: 1e-4
      rel: 1e-7
    Press:
      abs: 1e-4
      rel: 1e-7
    Temp:
      abs: 1e-4
      rel: 1e-7
    E_vdwl:
      abs: 1e-3
      rel: 1e-7
  overrides:
    in.rigid.tnr:
      Temp:
        abs: 1e-3
        rel: 1e-5
      Press:
        abs: 1e-2
        rel: 1e-4
  skip:
    [
      in.*pod.InP,
      in.disp,
      in.disp2,
      in.dos,
      in.*_imd*,
      in.bucky-plus-cnt*,
      in.gREM,
      in.rerun,
      in.rdf.rerun,
      in.read_dump,
      in.peptide-plumed,
      in.mliap.pytorch*,
      in.mliap.unified*,
    ]

  timeout: 120
  # input scripts in these folders must be run by the same worker in the listed
  # order, since they read files written by another input script in the folder
  # or would overwrite each other's output files
  keep_together:
    [
      PACKAGES/bocs/4_sites_LD_SG,
      PACKAGES/rhok,
      SPIN/read_restart,
    ]

  # input scripts without a reference log file cannot be checked against anything, so
  # they are only tested for not crashing, with their run commands shortened to this
  # many steps (0 or empty: run them unchanged)
  smoke_steps: 100

  nugget: 1.0
  epsilon: 1e-16


