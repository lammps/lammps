    <stop offset="1" stop-color="#3a4350"/>
  </radialGradient>
  <filter id="softshadow" x="-30%" y="-30%" width="170%" height="170%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
    <feOffset dx="5" dy="6" result="off"/>
    <feFlood flood-color="#000000" flood-opacity="0.30"/>
    <feComposite in2="off" operator="in" result="shadow"/>
    <feMerge>
      <feMergeNode in="shadow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="chipshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
    <feOffset dx="2" dy="3" result="off"/>
    <feFlood flood-color="#000000" flood-opacity="0.25"/>
    <feComposite in2="off" operator="in" result="shadow"/>
    <feMerge>
      <feMergeNode in="shadow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <marker id="grayhead" viewBox="0 0 10 10" refX="8.5" refY="5"
          markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
  </marker>
</defs>
