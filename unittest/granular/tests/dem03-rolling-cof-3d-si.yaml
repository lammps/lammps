---
lammps_version: REGENERATE
tags: granular, generated
date_generated: REGENERATE
epsilon: 1e-10
skip_tests:
prerequisites: ! |
  atom sphere
  pair granular
# Source: sphere_pure_rolling.in (user script). A sphere resting on a
# z-plane wall is given a pure spin (no translation) about y and damped
# to rest by rolling resistance (rolling sds). Axes already match the
# rolling_decay convention in test_analytic_models.cpp, so no remapping
# was needed -- material/kinematic values are transcribed as-is.
pre_commands: ! |
  units si
  dimension 3
  boundary p p f
  atom_style sphere
  region box block -0.05 0.05 -0.05 0.05 -0.01 0.05 units box
  create_box 1 box
  create_atoms 1 single 0.0 0.0 ${z0} units box
  set group all diameter ${diam} density ${dens}
  set group all omega 0.0 ${omega0} 0.0
  comm_modify vel yes
  neighbor 0.001 bin
  neigh_modify delay 0
  timestep ${dt}
post_commands: ! |
  fix grav all gravity 1.0 vector 0.0 0.0 -1.0
  fix integr all nve/sphere
  fix zwall all wall/gran granular hertz/material ${emod} ${en} ${poisson} damping coeff_restitution tangential linear_nohistory 0.0 0.0 rolling sds ${kr} 0.0 ${mur} damping coeff_restitution zplane 0.0 NULL
input_file:
natoms: 1
variables: ! |
  diam 0.005
  dens 2700.0
  emod 1.0e4
  poisson 0.33
  en 1.0
  mur 0.05
  kr 1.0e4
  grav 1.0
  omega0 1.0
  radius 0.0025
  dt 1.0e-6
  z0 0.0025
pair_style: granular
pair_coeff: ! |
  * * hertz/material ${emod} ${en} ${poisson} damping coeff_restitution tangential linear_nohistory 0.0 0.0 rolling sds ${kr} 0.0 ${mur} damping coeff_restitution
# NOTE: see dem11-wall-normal-cof-3d-si.yaml for the regeneration workflow.
# gravity uses vector magnitude 1.0 (matching the source script's
# "fix grav all gravity 1 vector 0 0 -1"), i.e. grav = 1.0 m/s^2 -- this is
# what the source script actually specified, not standard g; keep as-is
# unless the user intended standard gravity (9.81), in which case update
# both the fix and the "grav" variable together.
run_segments: ! |-
  400 400 400
analytic_enable: yes
analytic_model: rolling_decay
analytic_tol: 0.01
analytic_segment: 1
run_pos: ! |2
  # TODO: regenerate -- see NOTE above
run_vel: ! |2
  # TODO: regenerate -- see NOTE above
run_torque: ! |2
  # TODO: regenerate -- see NOTE above
run_omega: ! |2
  # TODO: regenerate -- see NOTE above
...
