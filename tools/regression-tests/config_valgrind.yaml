---
  lmp_binary: ""
  nprocs: "1"
  args: "-cite none"
  kokkos: false
  mpiexec: "mpirun valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes"
  mpiexec_numproc_flag: "-np"
  tolerance:
    PotEng:
      abs: 1e-4
      rel: 1e-7
    TotEng:
      abs: 1e-4
      rel: 1e-7
    Press:
      abs: 1e-4
      rel: 1e-7
    Temp:
      abs: 1e-4
      rel: 1e-7
    E_vdwl:
      abs: 1e-3
      rel: 1e-7
  overrides:
    in.rigid.tnr:
      Temp:
        abs: 1e-3
        rel: 1e-5
      Press:
        abs: 1e-2
        rel: 1e-4
  skip:
    [
      in.*pod.InP,
      in.dimer.mp,
      in.disp,
      in.disp2,
      in.dos,
      in.dpdrx-shardlow,
      in.dsring2,
      in.*_imd*,
      in.bucky-plus-cnt*,
      in.gREM,
      in.peptide-plumed,
      in.mliap.pytorch*,
      in.mliap.unified*,
      in.pod.compute,
      in.spin.iron-nve,
      in.spin.nvt_lattice,
      in.spin.nvt_spin,
      in.widom.spce,
    ]

  timeout: 600
  # input scripts in these folders must be run by the same worker in the listed
  # order, since they read files written by another input script in the folder
  # or would overwrite each other's output files
  keep_together:
    [
      PACKAGES/bocs/4_sites_LD_SG,
      PACKAGES/rhok,
      SPIN/read_restart,
    ]

  nugget: 1.0
  epsilon: 1e-16


