# GitHub action to build LAMMPS with the KOKKOS package (OpenMP backend) and
# run all example inputs this binary supports as regression tests.  An analyze
# pass screens out the inputs using styles missing from the binary and splits
# the rest into per-worker input lists balanced by their estimated cost, a
# matrix of jobs runs the lists, and a merge job combines the results with
# merge_results.py into a Markdown step summary, a merged JUnit XML file, and
# the run.json the LAMMPS test results dashboard ingests (the artifact name
# must keep its -results suffix for that).  The measured run times are carried
# from run to run in the actions cache, so the analyze pass of the next run
# can balance its input lists with measured costs.
name: "Kokkos OpenMP Regression Test"

on:
  push:
    branches:
      - develop

  workflow_dispatch:

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Screen and shard example inputs
    # restrict to official LAMMPS repository
    if: ${{ github.repository == 'lammps/lammps' }}
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 2
        show-progress: false

    - name: Install extra packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache ninja-build libeigen3-dev \
                     libcurl4-openssl-dev python3-dev \
                     mpi-default-bin mpi-default-dev

    - name: Create Build Environment
      run: mkdir build

    - name: Set up ccache
      uses: actions/cache@v6
      with:
        path: ${{ env.CCACHE_DIR }}
        key: linux-kokkos-ccache-${{ github.sha }}
        restore-keys: linux-kokkos-ccache-

    - name: Building LAMMPS via CMake
      shell: bash
      run: |
        ccache -z -M 5
        python3 -m venv linuxenv
        source linuxenv/bin/activate
        python3 -m pip install numpy pyyaml
        cmake -S cmake -B build \
              -C cmake/presets/gcc.cmake \
              -C cmake/presets/basic.cmake \
              -C cmake/presets/kokkos-openmp.cmake \
              -C cmake/presets/kokkos-packages.cmake \
              -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -D CMAKE_C_COMPILER_LAUNCHER=ccache \
              -D BUILD_SHARED_LIBS=off \
              -D DOWNLOAD_POTENTIALS=off \
              -G Ninja
        cmake --build build
        ccache -s

    - name: Restore measured run times of a previous run
      uses: actions/cache/restore@v6
      with:
        path: costs.json
        key: kokkos-regression-costs-${{ github.sha }}
        restore-keys: kokkos-regression-costs-

    - name: Screen example inputs and write balanced input lists
      shell: bash
      run: |
        source linuxenv/bin/activate
        export OMP_PROC_BIND=false
        python3 tools/regression-tests/run_tests.py \
               --lmp-bin=build/lmp \
               --config-file=tools/regression-tests/config_kokkos_openmp.yaml \
               --examples-top-level=examples \
               --analyze --num-workers=6 --cost-file=costs.json

    # also carries the reference walltime, the measured costs, and the list
    # of inputs screened out as incompatible (input-list-incompatible.txt)
    - name: Upload input lists
      uses: actions/upload-artifact@v7
      with:
        name: kokkos-regression-input-lists
        path: |
          input-list-*.txt
          walltime-ref.txt
          costs.json

  run:
    name: Run input list ${{ matrix.idx }}
    needs: analyze
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    strategy:
      fail-fast: false
      matrix:
        idx: [ 0, 1, 2, 3, 4, 5 ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 2
        show-progress: false

    - name: Install extra packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache ninja-build libeigen3-dev \
                     libcurl4-openssl-dev python3-dev \
                     mpi-default-bin mpi-default-dev

    - name: Create Build Environment
      run: mkdir build

    # the analyze job has saved a cache for this same commit, so this
    # rebuild is fast and reproduces the very binary that was analyzed
    - name: Set up ccache
      uses: actions/cache@v6
      with:
        path: ${{ env.CCACHE_DIR }}
        key: linux-kokkos-ccache-${{ github.sha }}
        restore-keys: linux-kokkos-ccache-

    - name: Building LAMMPS via CMake
      shell: bash
      run: |
        ccache -z -M 5
        python3 -m venv linuxenv
        source linuxenv/bin/activate
        python3 -m pip install numpy pyyaml
        cmake -S cmake -B build \
              -C cmake/presets/gcc.cmake \
              -C cmake/presets/basic.cmake \
              -C cmake/presets/kokkos-openmp.cmake \
              -C cmake/presets/kokkos-packages.cmake \
              -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -D CMAKE_C_COMPILER_LAUNCHER=ccache \
              -D BUILD_SHARED_LIBS=off \
              -D DOWNLOAD_POTENTIALS=off \
              -G Ninja
        cmake --build build
        ccache -s

    - name: Download input lists
      uses: actions/download-artifact@v7
      with:
        name: kokkos-regression-input-lists

    - name: Run regression tests
      shell: bash
      run: |
        source linuxenv/bin/activate
        export OMP_PROC_BIND=false
        # some example inputs reference bundled potential files without a path
        export LAMMPS_POTENTIALS=$PWD/potentials
        python3 tools/regression-tests/run_tests.py \
               --lmp-bin=build/lmp \
               --config-file=tools/regression-tests/config_kokkos_openmp.yaml \
               --list-input=input-list-${{ matrix.idx }}.txt \
               --output-file=output-${{ matrix.idx }}.xml \
               --progress-file=progress-${{ matrix.idx }}.yaml \
               --failure-file=failure-${{ matrix.idx }}.yaml \
               --log-file=run-${{ matrix.idx }}.log \
               --walltime-ref=$(cat walltime-ref.txt)

    - name: Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: kokkos-regression-shard-${{ matrix.idx }}
        path: |
          output-${{ matrix.idx }}.xml
          progress-${{ matrix.idx }}.yaml
          failure-${{ matrix.idx }}.yaml
          run-${{ matrix.idx }}.log

  merge:
    name: Merge results
    needs: [ analyze, run ]
    # merge whatever completed, even if some shards failed
    if: ${{ !cancelled() && needs.analyze.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 2
        show-progress: false

    - name: Download test results
      uses: actions/download-artifact@v7
      with:
        pattern: kokkos-regression-shard-*
        merge-multiple: true

    - name: Download input lists
      uses: actions/download-artifact@v7
      with:
        name: kokkos-regression-input-lists

    # merge_results.py only needs the Python standard library
    - name: Merge results and write summary
      shell: bash
      run: |
        python3 tools/regression-tests/merge_results.py \
               --title "Kokkos OpenMP Regression Test" \
               --output-xml regression.xml \
               --json run.json \
               --summary summary.md \
               --cost-file costs.json \
               --commit ${{ github.sha }} \
               --branch ${{ github.ref_name }} \
               output-*.xml
        cat summary.md >> $GITHUB_STEP_SUMMARY

    - name: Save measured run times for the next run
      uses: actions/cache/save@v6
      with:
        path: costs.json
        key: kokkos-regression-costs-${{ github.sha }}

    # the -results suffix and the run.json inside are what the test results
    # dashboard at https://lammps.github.io/lammps-test-results/ ingests
    - name: Upload merged results
      uses: actions/upload-artifact@v7
      with:
        name: kokkos-regression-results
        path: |
          run.json
          regression.xml
          summary.md

    - name: Combine shard logs into one artifact
      uses: actions/upload-artifact/merge@v7
      with:
        name: kokkos-regression-logs
        pattern: kokkos-regression-shard-*
        delete-merged: true
