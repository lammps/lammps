---
  lmp_binary: ""
  nprocs: "2"
  args: "-cite none -sf omp -pk omp 2"
  kokkos: false
  mpiexec: "mpirun"
  mpiexec_numproc_flag: "--host localhost:2 -np"
  tolerance:
    PotEng:
      abs: 1e-4
      rel: 1e-6
    TotEng:
      abs: 1e-4
      rel: 1e-6
    Press:
      abs: 1e-4
      rel: 1e-6
    Temp:
      abs: 1e-4
      rel: 1e-6
    E_vdwl:
      abs: 1e-3
      rel: 1e-7
  skip:
    [
      in.*pod.InP,
      in.comb3,
      in.dimer.mp,
      in.disp,
      in.disp2,
      in.dos,
      in.dpdrx-shardlow,
      in.dsring2,
      in.*_imd*,
      in.bucky-plus-cnt*,
      in.gREM,
      in.hybrid,
      in.peptide-plumed,
      in.mliap.pytorch*,
      in.mliap.unified*,
      in.pod.compute,
      in.spin.iron-nve,
      in.spin.nvt_lattice,
      in.spin.nvt_spin,
      in.template-mix,
      in.tmpl-data-mix,
      in.tmpl-restart-mix,
      in.water.acks2,
      in.water.acks2.field,
      in.widom.spce,
    ]

  timeout: 240
  # input scripts in these folders must be run by the same worker in the listed
  # order, since they read files written by another input script in the folder
  # or would overwrite each other's output files
  keep_together:
    [
      PACKAGES/bocs/4_sites_LD_SG,
      PACKAGES/rhok,
      SPIN/read_restart,
    ]

  # input scripts without a reference log file cannot be checked against anything, so
  # they are only tested for not crashing, with their run commands shortened to this
  # many steps (0 or empty: run them unchanged)
  smoke_steps: 100

  nugget: 1.0
  epsilon: 1e-16
